name: doctrack

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?replicaSet=rs0&authSource=admin
  MONGO_DB: ${MONGO_DB:-doctrack}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  NATS_URL: nats://nats:4222
  NATS_USER: ${NATS_USER}
  NATS_PASSWORD: ${NATS_PASSWORD}

services:
  mongo:
    image: mongo:8
    entrypoint: ['/infra/entrypoint.sh']
    command: ['mongod', '--replSet', 'rs0', '--keyFile', '/data/configdb/keyfile', '--bind_ip_all']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    secrets:
      - mongo-keyfile
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/entrypoint.sh:/infra/entrypoint.sh:ro
      - ./infra/mongo/healthcheck.sh:/infra/healthcheck.sh:ro
    healthcheck:
      test: ['CMD', '/infra/healthcheck.sh']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  nats:
    image: nats:2.11-alpine
    command:
      [
        '-js',
        '-sd',
        '/data',
        '--http_port',
        '8222',
        '--user',
        '${NATS_USER}',
        '--pass',
        '${NATS_PASSWORD}',
      ]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-env
      PORT: 8080
    ports:
      - '127.0.0.1:${API_HOST_PORT:-8080}:8080'
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    environment:
      <<: *api-env
      WORKER_PORT: 9090
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/health']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8080
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [internal]

secrets:
  mongo-keyfile:
    file: ./secrets/mongo-keyfile

volumes:
  mongo-data:
  redis-data:
  nats-data:

networks:
  internal:
